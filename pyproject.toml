[tool.poetry]
name = "cli"
version = "0.3.2"
description = "Command-line interface to the Matchescu entity resolution system"
authors = ["Andrei Olar <andrei.olar@ubbcluj.ro>"]
readme = "README.md"
packages = [{ include = "matchescu", from = "src" }]

[tool.poetry.dependencies]
python = "!=3.14.1,~3.13"
click = "^8.5.0"
matchescu-matching = { path = "../matching", develop = true }
matchescu-clustering = { path = "../clustering", develop = true }
pydantic = "^2.13.4"
matchescu-comparison-space-generation = { path = "../comparison-space-generation", develop = true }
tensorboard = "^2.21.0"
plotly = "^6.9.0"
matchescu-base = { path = "../base", develop = true }
rich = "^14.3.3"
pyresolvemetrics = "^0.3.5"
matchescu-reference-extraction = { path = "../reference-extraction", develop = true }
rapidfuzz = "^3.14.5"
matchescu-reference-store = { path = "../reference-store", develop = true }
scikit-learn = "^1.9.0"
matplotlib = "^3.10.8"
seaborn = "^0.13.2"
great-tables = "^0.21.0"
polars = "^1.44.1"
scipy = "^1.17.1"
statsmodels = "^0.14.6"

[tool.poetry.group.dev.dependencies]
kaleido = ">=1.2.0,<2.0.0"
black = "^25.12.0"
mypy = "^1.20.2"
ruff = "^0.16.5"
pytest = "^8.4.2"

[tool.poetry.scripts]
matchescu = "matchescu.cli:matchescu"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
