[tool.poetry]
name = "cli"
version = "0.1.3"
description = "Command-line interface to the Matchescu entity resolution system"
authors = ["Andrei Olar <andrei.olar@ubbcluj.ro>"]
readme = "README.md"
packages = [{include = "matchescu", from = "src"}]

[tool.poetry.dependencies]
python = "!=3.14.1,>=3.13,<3.15"
click = "^8.1.3"
matchescu-matching = "^0.20.4"
matchescu-clustering = "^0.15.5"
pydantic = "^2.12.5"
matchescu-comparison-space-generation = "^0.8.4"
tensorboard = "^2.20.0"
plotly = "^6.6.0"
matchescu-base = "^0.26.0"
rich = "^14.3.3"
pyresolvemetrics = "^0.3.5"
matchescu-reference-extraction = "^0.9.1"
rapidfuzz = "^3.14.3"
matchescu-reference-store = "^0.9.2"

[tool.poetry.scripts]
matchescu = "matchescu.cli:matchescu"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "kaleido (>=1.2.0,<2.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "mypy (>=1.20.0,<2.0.0)",
    "ruff (>=0.15.9,<0.16.0)",
    "pytest (>=9.0.2,<10.0.0)"
]
