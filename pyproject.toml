[tool.poetry]
name = "cli"
version = "0.1.0"
description = "Command-line interface to the Matchescu entity resolution comparison system"
authors = ["Andrei Olar <andrei.olar@ubbcluj.ro>"]
readme = "README.md"
packages = [{include = "matchescu", from = "src"}]

[tool.poetry.dependencies]
python = "!=3.14.1,>=3.13,<3.15"
click = "^8.1.3"
matchescu-matching = "^0.18.0"
matchescu-clustering = "^0.15.4"
pydantic = "^2.12.5"
matchescu-comparison-space-generation = "^0.8.2"
tensorboard = "^2.20.0"
plotly = "^6.6.0"
matchescu-base = "^0.25.0"

[tool.poetry.scripts]
matchescu = "matchescu.cli:matchescu"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "kaleido (>=1.2.0,<2.0.0)"
]
